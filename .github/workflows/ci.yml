name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Rust security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ github.token }}

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/vault_sync/requirements.txt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Test native PowerShell installer
        shell: powershell
        run: scripts/test-install.ps1
      - name: Test named-pipe runtime
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "memento-runtime"
          $vault = Join-Path $env:RUNNER_TEMP "memento-vault"
          New-Item -ItemType Directory -Force -Path $runtime, $vault | Out-Null
          Set-Content -LiteralPath (Join-Path $vault "windows.md") -Value "# Windows`nMemento named pipe integration proof."
          $env:MEMENTO_DATA_DIR = $runtime
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:GITHUB_WORKSPACE\target\debug\memento.exe" init --preset windows --vault-root $vault
            & "$env:GITHUB_WORKSPACE\target\debug\memento.exe" sync obsidian $vault --json
            $result = & "$env:GITHUB_WORKSPACE\target\debug\memento.exe" query "named pipe integration proof" --output compact
            if ($LASTEXITCODE -ne 0 -or $result -notmatch "windows.md") { throw "Windows query smoke test failed" }
            $clients = 1..16 | ForEach-Object {
              Start-Process `
                -FilePath "$env:GITHUB_WORKSPACE\target\debug\memento.exe" `
                -ArgumentList "status", "--json" `
                -PassThru `
                -WindowStyle Hidden
            }
            $clients | Wait-Process
            foreach ($client in $clients) {
              if ($client.ExitCode -ne 0) { throw "concurrent named-pipe client failed with $($client.ExitCode)" }
            }
          } finally {
            Pop-Location
            $pidPath = Join-Path $runtime "mementod.pid"
            if (Test-Path $pidPath) { Stop-Process -Id ([int](Get-Content $pidPath)) -Force -ErrorAction SilentlyContinue }
          }

  python-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Python deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check tools
      - name: Python tests
        run: uv run python -m unittest discover -s tools/vault_sync/tests -v

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Python deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check tools
      - name: Documentation
        run: uv run python tools/check_docs.py
      - name: Python tests
        run: uv run python -m unittest discover -s tools/vault_sync/tests -v

  packaging:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Validate release scripts
        run: bash -n scripts/*.sh
      - name: Test agent installer
        run: scripts/test-install.sh
      - name: Render Homebrew formula
        run: |
          checksum_0="$(printf '0%.0s' {1..64})"
          checksum_1="$(printf '1%.0s' {1..64})"
          checksum_2="$(printf '2%.0s' {1..64})"
          checksum_3="$(printf '3%.0s' {1..64})"
          scripts/render-homebrew-formula.sh 0.1.0 "$checksum_0" "$checksum_1" "$checksum_2" "$checksum_3" > /tmp/memento.rb
          ruby -c /tmp/memento.rb
          brew tap-new --no-git arvorco/memento-ci
          tap_dir="$(brew --repository arvorco/memento-ci)"
          cp /tmp/memento.rb "$tap_dir/Formula/memento.rb"
          brew style arvorco/memento-ci/memento

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memento-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: memento-web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
