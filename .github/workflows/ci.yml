name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install Python deps
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check tools
      - name: Documentation
        run: uv run python tools/check_docs.py
      - name: Python tests
        run: uv run python -m unittest discover -s tools/vault_sync/tests -v

  packaging:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate release scripts
        run: bash -n scripts/*.sh
      - name: Test agent installer
        run: scripts/test-install.sh
      - name: Render Homebrew formula
        run: |
          checksum_0="$(printf '0%.0s' {1..64})"
          checksum_1="$(printf '1%.0s' {1..64})"
          checksum_2="$(printf '2%.0s' {1..64})"
          checksum_3="$(printf '3%.0s' {1..64})"
          scripts/render-homebrew-formula.sh 0.1.0 "$checksum_0" "$checksum_1" "$checksum_2" "$checksum_3" > /tmp/memento.rb
          ruby -c /tmp/memento.rb
          brew tap-new --no-git arvorco/memento-ci
          tap_dir="$(brew --repository arvorco/memento-ci)"
          cp /tmp/memento.rb "$tap_dir/Formula/memento.rb"
          brew style arvorco/memento-ci/memento

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memento-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: memento-web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
