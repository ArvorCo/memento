name: Bug report
description: Report reproducible incorrect behavior in Memento.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private memory content, credentials, or undisclosed vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Memento version
      placeholder: memento 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS x86_64
        - Linux arm64
        - Linux x86_64
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant `memento doctor` output or logs after removing private paths and content.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal memory content, credentials, and private paths.
          required: true
