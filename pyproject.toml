[project]
name = "memento-tools"
version = "0.1.0"
description = "Python sync and import tooling for Memento."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pypdf>=6.0,<7",
]

[dependency-groups]
dev = [
  "ruff>=0.15.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/vault_sync/apple_notes.py" = ["E501"]
"tools/vault_sync/presets.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
