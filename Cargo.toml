[workspace]
members = [
    "libmemento",
    "mementod",
    "memento-cli",
    "memento-api",
    "memento-research",
    "memento-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Arvor <hello@arvor.co>"]
repository = "https://github.com/ArvorCo/memento"
homepage = "https://github.com/ArvorCo/memento"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
